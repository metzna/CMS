<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CMS</title>
  <link rel="stylesheet" href="style.css">
  <script>
    // Set before rendering, otherwise the wrong scheme flashes briefly.
    try {
      const chosen = localStorage.getItem("cms-theme");
      if (chosen === "light" || chosen === "dark") {
        document.documentElement.dataset.theme = chosen;
      }
    } catch (error) { /* no access to localStorage: fall back to system */ }
  </script>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-head">
      <label class="section-picker">
        <span class="visually-hidden">Section</span>
        <select id="section"></select>
      </label>
      <button id="new-post" type="button">+ New</button>
    </div>
    <ul id="post-list" class="post-list"></ul>
    <div class="sidebar-foot">
      <button id="theme" type="button" aria-live="polite">Theme: System</button>
    </div>
  </aside>

  <main class="editor">
    <form id="post-form" hidden>
      <div class="fields">
        <label class="field grow">
          <span>Title</span>
          <!-- No " and no \ in the title: title: "..." in the front matter would break.
               The server checks this too; this just reports it earlier. -->
          <input id="title" name="title" type="text" required autocomplete="off"
                 pattern="[^&quot;\\]*"
                 title="&quot; and \ are not allowed in the title.">
        </label>
        <label class="field">
          <span>Date</span>
          <input id="date" name="date" type="date" required>
        </label>
        <label class="field check">
          <input id="draft" name="draft" type="checkbox">
          <span>Draft</span>
        </label>
      </div>

      <div class="toolbar">
        <span id="filename" class="filename"></span>
        <!-- On the left, away from "Save": a misclick would be annoying. -->
        <button id="delete" type="button" class="danger" hidden>Delete</button>
        <div class="toolbar-right">
          <button id="image" type="button">Image</button>
          <input id="image-file" type="file" accept="image/*" hidden>
          <button id="toggle-preview" type="button">Preview</button>
          <button id="save" type="submit" class="primary">Save</button>
          <!-- Shows saving and building as one operation. The matching text
               is in the status line, hence aria-hidden here. -->
          <span id="build-state" class="build-state" aria-hidden="true"></span>
        </div>
      </div>

      <div class="panes">
        <textarea id="body" name="body" spellcheck="false"
                  placeholder="Text in Markdown …"></textarea>
        <div id="preview" class="preview" hidden></div>
      </div>
    </form>

    <p id="empty" class="empty">Pick an entry on the left or create a new one.</p>
    <p id="status" class="status" role="status"></p>
  </main>

  <script src="app.js"></script>
</body>
</html>
