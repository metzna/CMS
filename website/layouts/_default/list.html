{{ define "main" }}
  <article class="content">
    <h1>{{ .Title }}</h1>
    {{ .Content }}
  </article>

  <section class="post-list">
    <ul>
      {{ range .Pages.ByDate.Reverse }}
        <li>
          <a href="{{ .RelPermalink }}">{{ .Title }}</a>
          <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "02.01.2006" }}</time>
        </li>
      {{ else }}
        <li>Noch keine Beiträge.</li>
      {{ end }}
    </ul>
  </section>
{{ end }}
