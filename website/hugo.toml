baseURL = 'https://example.org/'
languageCode = 'de-de'
title = 'Meine Seite'

# Without this, Hugo reads "date: 2026-09-19" as UTC midnight. Between 00:00
# and 02:00 our time that is still in the future -- Hugo then treats the post
# as scheduled and leaves it out of the build without complaint. A post
# written at night would only appear hours later.
timeZone = 'Europe/Berlin'

[params]
  description = 'Eine kleine Hugo-Seite.'

[menu]
  [[menu.main]]
    name = 'Start'
    url = '/'
    weight = 1
  [[menu.main]]
    name = 'Blog'
    url = '/posts/'
    weight = 2
  [[menu.main]]
    name = 'Veranstaltungen'
    url = '/veranstaltungen/'
    weight = 3
  [[menu.main]]
    name = 'Über'
    url = '/ueber/'
    weight = 4

[markup.goldmark.renderer]
  unsafe = true
