# ---------------------------------------------------------------------------
# CMS configuration for this site.
#
# Lives next to the content folder, i.e. in the site's repo and not with the
# CMS: every customer site brings its own. Different path: --config <file>.
#
# Only read at startup — restart the server after a change. If anything in it
# is broken, the server won't start and names the location and reason. That's
# intentional: better to fail at startup than in front of the customer.
# ---------------------------------------------------------------------------


# OPTIONAL. Shown in the browser tab of the UI. Default: "CMS".
# With several customer tabs open, this is the only difference.
title = "Meine Seite"


# REQUIRED: at least one [[sections]] block. Each one opens a subfolder of
# content/ for editing — whatever isn't listed here, the customer doesn't see.
#
# The order here is the order in the dropdown; on opening, the first section
# whose folder exists is preselected.
#
#   dir    REQUIRED.  Subfolder in content/. Only a-z, 0-9, - and _, no
#                     slash. The folder must exist, otherwise the section
#                     shows as "(folder missing)" and can't be selected.
#   name   OPTIONAL.  Label in the dropdown. Default: dir.
#   id     OPTIONAL.  Appears in the URL (/api/sections/<id>/entries).
#                     Default: dir. Same characters as dir, and unique per
#                     file. Only needed if the URL should differ from the
#                     folder name — e.g. because the folder moves later.
#
# Never editable, regardless of what's here: the sections' _index.md (the
# overview texts) and anything outside the listed folders. An entry is always
# a .md file directly in the folder; Hugo page bundles (a subfolder per post)
# don't show up in the list.

[[sections]]
dir = "posts"
name = "Blog"

[[sections]]
dir = "veranstaltungen"
name = "Veranstaltungen"
